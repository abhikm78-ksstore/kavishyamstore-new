<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contact | KaviShyam Store</title>

<link rel="stylesheet" href="css/style.css">

<style>

.contact-section{
padding:60px 8%;
}

.contact-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:25px;
margin-top:30px;
}

.contact-card{
background:#fff;
padding:25px;
border-radius:12px;
box-shadow:0 5px 15px rgba(0,0,0,.1);
text-align:center;
}

.contact-card h3{
margin-bottom:15px;
}

.contact-card a{
text-decoration:none;
color:#111;
font-weight:bold;
}

.contact-form{
max-width:700px;
margin:50px auto;
background:#fff;
padding:30px;
border-radius:12px;
box-shadow:0 5px 15px rgba(0,0,0,.1);
}

.contact-form input,
.contact-form textarea{
width:100%;
padding:14px;
margin:10px 0;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
}

.contact-form button{
background:#111;
color:#fff;
padding:14px 30px;
border:none;
border-radius:8px;
cursor:pointer;
font-size:16px;
}

.contact-form button:hover{
background:#444;
}

.whatsapp-float{
position:fixed;
bottom:20px;
right:20px;
width:60px;
height:60px;
background:#25D366;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:30px;
text-decoration:none;
color:#fff;
box-shadow:0 5px 15px rgba(0,0,0,.3);
z-index:999;
}

footer{
background:#111;
color:#fff;
padding:20px;
text-align:center;
margin-top:50px;
}

</style>

</head>

<body>

<header>

<div class="logo">
<h1>🦚 KaviShyam Store</h1>
</div>

<nav>

<a href="index.html">Home</a>

<a href="shop.html">Shop</a>

<a href="about.html">About</a>

<a href="contact.html">Contact</a>

</nav>

</header>

<section class="hero">

<h1>Contact KaviShyam Store</h1>

<p>We are always happy to help you.</p>

</section>

<section class="contact-section">

<h2 style="text-align:center;">Get In Touch</h2>

<div class="contact-grid">

<div class="contact-card">

<h3>📞 Call Us</h3>

<a href="tel:+917289094501">

+91 72890 94501

</a>

</div>

<div class="contact-card">

<h3>💬 WhatsApp</h3>

<a href="https://wa.me/917289094501" target="_blank">

Chat on WhatsApp

</a>

</div>

<div class="contact-card">

<h3>📧 Email</h3>

<a href="mailto:support@kavishyamstore.in">

support@kavishyamstore.in

</a>

</div>

<div class="contact-card">

<h3>📍 Address</h3>

Delhi, India

</div>

</div>

<div class="contact-form">

<h2 style="text-align:center;">Send Message</h2>

<form>

<input type="text" placeholder="Your Name" required>

<input type="email" placeholder="Your Email" required>

<input type="text" placeholder="Subject">

<textarea rows="6" placeholder="Write Your Message"></textarea>

<button type="submit">

Send Message

</button>

</form>

</div>

</section>

<footer>

© 2026 KaviShyam Store | All Rights Reserved

</footer>

<a href="https://wa.me/917289094501" class="whatsapp-float" target="_blank">

💬

</a>

<script src="js/script.js"></script>

</body>
</html>
